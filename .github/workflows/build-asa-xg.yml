name: Build American Soccer Analysis xG data

on:
  push:
    paths:
      - "scripts/build_asa_xg_data.py"
      - "scripts/backtest_asa_xg.py"
      - ".github/workflows/build-asa-xg.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: asa-xg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public ASA xG index
        run: python scripts/build_asa_xg_data.py
      - name: Backtest xG model against goals-only baseline
        run: python scripts/backtest_asa_xg.py
      - name: Commit updated data
        run: |
          git add public-data/asa-xg.json public-data/asa-xg-benchmark.json
          if git diff --cached --quiet; then
            echo "ASA xG data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public ASA xG data"
          git push
