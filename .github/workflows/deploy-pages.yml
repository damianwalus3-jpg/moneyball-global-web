name: Deploy MONEYBALL GLOBAL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun run test
      - name: Build static SPA
        env:
          VITE_SUPABASE_URL: https://gzgeklcukrclgwbsmbsp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YdT4Nm50NkbmjKnoQE8bNQ_aGeqzG3S
        run: bun run build
      - name: Inspect static output and add SPA fallback when available
        run: |
          find dist -maxdepth 4 -type f -name '*.html' -print
          if [ ! -f dist/client/index.html ] && [ -f dist/client/_shell.html ]; then cp dist/client/_shell.html dist/client/index.html; fi
          test -f dist/client/index.html
          # Publish generated keyless datasets as static assets for the SPA fallback.
          mkdir -p dist/client/public-data
          if [ -d public-data ]; then cp -R public-data/. dist/client/public-data/; fi
          cp dist/client/index.html dist/client/404.html
          # GitHub Pages does not rewrite nested SPA routes to index.html.
          # Publish an entry file at every client-side route so direct links work.
          for route in panel mecze prognozy-1x2 double-chance kupony historia statystyki bankroll ustawienia login reset-password setup; do
            mkdir -p "dist/client/$route"
            cp dist/client/index.html "dist/client/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
