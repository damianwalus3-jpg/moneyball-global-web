name: Deploy MONEYBALL GLOBAL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun run test
      - name: Build static SPA
        run: bun run build
      - name: Add SPA fallback for GitHub Pages deep links
        run: cp .output/public/index.html .output/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
