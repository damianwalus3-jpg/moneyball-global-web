name: Moneyball quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Verify predictor uses the generated history dataset
        run: |
          grep -Fq 'OUT = Path("public-data/team-history.json")' scripts/build_public_football_data.py
          grep -Fq 'public-data/team-history.json' supabase/functions/moneyball-predict/index.ts
          ! grep -Fq 'public-data/team-form.json' supabase/functions/moneyball-predict/index.ts
      - name: Tests
        run: bun run test
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://gzgeklcukrclgwbsmbsp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YdT4Nm50NkbmjKnoQE8bNQ_aGeqzG3S
        run: bun run build
