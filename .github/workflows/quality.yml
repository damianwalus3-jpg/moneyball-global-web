name: Moneyball quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://gzgeklcukrclgwbsmbsp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YdT4Nm50NkbmjKnoQE8bNQ_aGeqzG3S
        run: bun run build
