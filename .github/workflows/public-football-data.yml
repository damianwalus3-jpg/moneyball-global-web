name: Refresh keyless football data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_football_data.py"
      - "scripts/build_public_football_fixtures.py"
      - ".github/workflows/public-football-data.yml"
permissions:
  contents: write
concurrency:
  group: public-football-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build public football history (no API keys)
        run: python3 scripts/build_public_football_data.py
      - name: Build keyless multi-competition fixtures
        run: python3 scripts/build_public_football_fixtures.py
      - name: Validate generated JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("public-data/team-history.json", "public-data/fixtures.json"):
              path = Path(name)
              raw = path.read_text(encoding="utf-8")
              print(f"Validating {name}: {len(raw)} characters")
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON in {name}: {exc}") from exc
              if name.endswith("team-history.json"):
                  assert payload["coverage"]["competitions_with_results"] >= 15
                  assert payload["coverage"]["team_names"] >= 100
                  assert payload["teams"]
                  print("History coverage:", payload["coverage"])
              elif name.endswith("fixtures.json"):
                  assert payload["coverage"]["competitions_with_fixtures"] >= 10
                  assert payload["coverage"]["fixture_count"] > 0
                  assert all(x.get("date") and x.get("home_team") and x.get("away_team") for x in payload["fixtures"])
                  print("Fixture coverage:", payload["coverage"])
          PY
      - name: Publish refreshed data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve this run's generated data and rebase the data-only commit
          # on the newest main after every rejected push.
          mkdir -p "$RUNNER_TEMP/moneyball-public-data"
          cp public-data/team-history.json public-data/team-form.json public-data/fixtures.json "$RUNNER_TEMP/moneyball-public-data/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/moneyball-public-data/"*.json public-data/
            git add public-data/team-history.json public-data/team-form.json public-data/fixtures.json
            if git diff --cached --quiet; then
              echo "Public football dataset is unchanged."
              exit 0
            fi
            git commit -m "Refresh keyless public football history"
            if git push origin HEAD:main; then
              echo "Public football dataset published on attempt $attempt."
              exit 0
            fi
            echo "main advanced during push; retrying against latest main (attempt $attempt)."
            sleep $((attempt * 2))
          done
          echo "Could not publish generated datasets after five retries."
          exit 1
