name: Refresh keyless football data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_football_data.py"
      - "scripts/build_public_football_fixtures.py"
      - ".github/workflows/public-football-data.yml"
permissions:
  contents: write
concurrency:
  group: public-football-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build public football history (no API keys)
        run: python3 scripts/build_public_football_data.py
      - name: Build keyless multi-competition fixtures
        run: python3 scripts/build_public_football_fixtures.py
      - name: Validate generated JSON
        run: |
          python3 -m json.tool public-data/team-history.json > /dev/null
          python3 -m json.tool public-data/team-form.json > /dev/null
          python3 -m json.tool public-data/fixtures.json > /dev/null
          jq -e '.coverage.competitions_with_results >= 15 and .coverage.team_names >= 100 and (.teams | length > 0)' public-data/team-history.json > /dev/null
          jq -e '.coverage.competitions_with_fixtures >= 10 and .coverage.fixture_count > 0 and ([.fixtures[] | select((.date | length) > 0 and (.home_team | length) > 0 and (.away_team | length) > 0)] | length == .coverage.fixture_count)' public-data/fixtures.json > /dev/null
          echo "Validated team history and public fixture index with jq."
      - name: Publish refreshed data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/team-history.json public-data/team-form.json public-data/fixtures.json
          if git diff --cached --quiet; then
            echo "Public football dataset is unchanged."
          else
            git commit -m "Refresh keyless public football history"
            # Human edits and other Actions workflows can advance main while the
            # data build is running. Rebase generated JSON on the latest main.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
