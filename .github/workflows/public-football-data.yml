name: Refresh keyless football data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_public_football_data.py"
      - "scripts/build_public_football_fixtures.py"
      - ".github/workflows/public-football-data.yml"
permissions:
  contents: write
concurrency:
  group: public-football-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build public football history (no API keys)
        run: python3 scripts/build_public_football_data.py
      - name: Build keyless multi-competition fixtures
        run: python3 scripts/build_public_football_fixtures.py
      - name: Validate generated JSON
        run: |
          python3 -m json.tool public-data/team-history.json > /dev/null
          python3 -m json.tool public-data/fixtures.json > /dev/null
          python3 - <<'PY'
          import json
          p=json.load(open("public-data/team-history.json", encoding="utf-8"))
          assert p["coverage"]["competitions_with_results"] >= 15
          assert p["coverage"]["team_names"] >= 100
          assert p["teams"]
          print("History generated:", p["coverage"])
          f=json.load(open("public-data/fixtures.json", encoding="utf-8"))
          assert f["coverage"]["competitions_with_fixtures"] >= 10
          assert f["coverage"]["fixture_count"] > 0
          assert all(x.get("date") and x.get("home_team") and x.get("away_team") for x in f["fixtures"])
          print("Fixtures generated:", f["coverage"])
          PY
      - name: Publish refreshed data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/team-history.json public-data/fixtures.json
          if git diff --cached --quiet; then
            echo "Public football dataset is unchanged."
          else
            git commit -m "Refresh keyless public football history"
            # Human edits and other Actions workflows can advance main while the
            # data build is running. Rebase generated JSON on the latest main.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
