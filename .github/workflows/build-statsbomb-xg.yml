name: Build StatsBomb historical xG data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_statsbomb_xg_data.py
      - .github/workflows/build-statsbomb-xg.yml
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: write

concurrency:
  group: statsbomb-xg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build selected StatsBomb event-derived xG index
        run: python scripts/build_statsbomb_xg_data.py

      - name: Publish compact xG index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/statsbomb-xg.json public-data/statsbomb-xg-summary.json
          if git diff --cached --quiet; then
            echo "StatsBomb xG data is unchanged."
            exit 0
          fi
          git commit -m "Update StatsBomb historical xG data"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push race on attempt $attempt; retrying after refreshing main."
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          if [ "$pushed" != "true" ]; then
            echo "Could not publish StatsBomb xG data after five retries."
            exit 1
          fi
