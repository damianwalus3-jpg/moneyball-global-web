name: Build StatsBomb historical xG data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_statsbomb_xg_data.py
      - .github/workflows/build-statsbomb-xg.yml
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: write

concurrency:
  group: statsbomb-xg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build selected StatsBomb event-derived xG index
        run: python scripts/build_statsbomb_xg_data.py

      - name: Publish generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/generated-data
          cp public-data/statsbomb-xg.json /tmp/generated-data/0.json
          cp public-data/statsbomb-xg-summary.json /tmp/generated-data/1.json
          # Rebuild the data commit on the newest main; do not rebase generated
          # JSON over a concurrent data publish or app deployment.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/generated-data/0.json public-data/statsbomb-xg.json
            cp /tmp/generated-data/1.json public-data/statsbomb-xg-summary.json
            git add public-data/statsbomb-xg.json public-data/statsbomb-xg-summary.json
            if git diff --cached --quiet; then
              echo "Generated data is already current on main."
              exit 0
            fi
            git commit -m "Update StatsBomb historical xG data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Could not publish generated data after five attempts."
          exit 1
