name: Build OpenPlay historical xG data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_openplay_xg_data.py
      - scripts/backtest_openplay_xg.py
      - .github/workflows/build-openplay-xg.yml
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: openplay-xg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the public OpenPlay reader
        run: python -m pip install --upgrade pip openplay==0.1.0

      - name: Build and validate historical xG index
        run: python scripts/build_openplay_xg_data.py

      - name: Backtest xG against a goals-only baseline
        run: python scripts/backtest_openplay_xg.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/openplay-xg.json public-data/openplay-xg-summary.json public-data/openplay-xg-backtest.json
          if git diff --cached --quiet; then
            echo "OpenPlay data is unchanged."
            exit 0
          fi
          git commit -m "Update OpenPlay historical xG data"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push race on attempt $attempt; retrying after refreshing main."
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          if [ "$pushed" != "true" ]; then
            echo "Could not publish OpenPlay xG data after five retries."
            exit 1
          fi
