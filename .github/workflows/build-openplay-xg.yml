name: Build OpenPlay historical xG data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_openplay_xg_data.py
      - scripts/backtest_openplay_xg.py
      - .github/workflows/build-openplay-xg.yml
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: openplay-xg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the public OpenPlay reader
        run: python -m pip install --upgrade pip openplay==0.1.0

      - name: Build and validate historical xG index
        run: python scripts/build_openplay_xg_data.py

      - name: Backtest xG against a goals-only baseline
        run: python scripts/backtest_openplay_xg.py

      - name: Publish generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/generated-data
          cp public-data/openplay-xg.json /tmp/generated-data/0.json
          cp public-data/openplay-xg-backtest.json /tmp/generated-data/1.json
          # Rebuild the data commit on the newest main; do not rebase generated
          # JSON over a concurrent data publish or app deployment.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/generated-data/0.json public-data/openplay-xg.json
            cp /tmp/generated-data/1.json public-data/openplay-xg-backtest.json
            git add public-data/openplay-xg.json public-data/openplay-xg-backtest.json
            if git diff --cached --quiet; then
              echo "Generated data is already current on main."
              exit 0
            fi
            git commit -m "Update OpenPlay historical xG data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Could not publish generated data after five attempts."
          exit 1
