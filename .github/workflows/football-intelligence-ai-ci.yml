name: FOOTBALL INTELLIGENCE AI CI

on:
  push:
    branches:
      - football-intelligence-ai
    paths:
      - "FOOTBALL_INTELLIGENCE_AI/**"
      - ".github/workflows/football-intelligence-ai-ci.yml"
  pull_request:
    branches:
      - football-intelligence-ai
    paths:
      - "FOOTBALL_INTELLIGENCE_AI/**"
      - ".github/workflows/football-intelligence-ai-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FOOTBALL_INTELLIGENCE_AI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --install-strategy=shallow
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
